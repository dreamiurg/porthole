name: Pages

# Publishes site/ (the project page) to https://porthole.dreamiurg.net. The game pictures, updates
# strip and case STLs are copied from where the README and the CAD keep them. The custom domain is set in the repo's
# Pages settings, not by a CNAME file: an Actions-deployed site ignores that file.
# The home page's player is the firmware itself in the browser: apps/porthole's sim built with Emscripten (make web)
# from this commit into site/play/, so every merge that touches the app republishes it.

on:
  push:
    branches: [main]
    paths: [site/**, docs/games/**, docs/updates.png, hardware/case/stl/**, apps/porthole/**, .github/workflows/pages.yml]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    env:
      EMSDK_VERSION: 4.0.10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Copy the game pictures, the updates strip and the case STLs the page shows
        run: |
          cp -r docs/games site/games
          cp docs/updates.png site/images/updates.png
          mkdir -p site/case
          cp hardware/case/stl/v1.1/puck_bezel.stl hardware/case/stl/v1.1/puck_plate.stl hardware/case/stl/v1.2/puck_lid.stl site/case/
      - name: Restore emsdk
        id: emsdk
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}
      - name: Install emsdk
        if: steps.emsdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk ~/emsdk
          ~/emsdk/emsdk install "$EMSDK_VERSION"
          ~/emsdk/emsdk activate "$EMSDK_VERSION"
      - name: Build the browser emulator into site/play
        run: |
          # shellcheck source=/dev/null  # emsdk_env.sh lives outside the repo
          source ~/emsdk/emsdk_env.sh
          make -C apps/porthole web
          cp apps/porthole/build/web/porthole.js apps/porthole/build/web/porthole.wasm site/play/
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/" site/index.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
