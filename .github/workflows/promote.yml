name: Promote

# Cuts a stable Porthole release from a beta. Every merge ships a beta patch (0.38.1, 0.38.2, ...;
# see release.yml). Promoting beta 0.38.7 rebuilds its commit as 0.39.0, publishes that as GitHub's
# Latest (what stable boards read: releases/latest), and moves the `stable` branch to it. The
# next beta is 0.39.1. Beta boards stay where they are: 0.39.0 is the code they already run.
#
# Daily, it promotes by itself: the newest beta that is at least MIN_AGE_HOURS old, newer than
# the current stable, and not yanked (yank.yml). So stable trails beta by about three days, and
# a beta found broken in that time never reaches stable.
# By hand: run it with a tag to promote that tag now, or with no tag for the newest beta.
# Promoting an older tag is a rollback: the old code goes out as the next minor, so every stable
# board takes it (boards never install an older version).

on:
  schedule:
    - cron: "0 17 * * *"  # 10:00 Pacific in summer (09:00 in winter)
  workflow_dispatch:
    inputs:
      tag:
        description: "Beta tag to promote, e.g. porthole-v0.38.7 (empty: the newest beta that isn't yanked)"
        required: false
        default: ""

# Not shared with release.yml: GitHub keeps one pending run per group, so a queued promote would cancel a pending
# release. Their tags can't collide: releases add a patch to the newest tag they contain, promotions a minor to the
# newest tag of all.
concurrency:
  group: promote
  cancel-in-progress: false

permissions:
  contents: write

env:
  APP: porthole
  MIN_AGE_HOURS: 72

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # tags and history, for the version and the notes
      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          # By hand with no tag: the newest beta now. On schedule: only one old enough.
          MIN_AGE: ${{ github.event_name == 'schedule' && env.MIN_AGE_HOURS || '0' }}
        run: |
          gh release list --limit 1000 --json tagName,name,isPrerelease,createdAt \
            | python3 tools/release.py promote --app "$APP" --tag "$TAG" --min-age-hours "$MIN_AGE" --notes notes.md > plan.txt
          if [ ! -s plan.txt ]; then
            echo "nothing to promote: ${TAG:-no beta newer than stable, ${MIN_AGE}h old and not yanked}${TAG:+ is already stable}"
            exit 0
          fi
          source=$(sed -n 's/^source=//p' plan.txt)
          sha=$(git rev-parse "$source^{commit}")
          { cat plan.txt; echo "sha=$sha"; } >> "$GITHUB_OUTPUT"
          echo "promoting $source ($sha) as $(sed -n 's/^tag=//p' plan.txt)"
          # Build the beta's own commit in src/; the build action and channel check still come from this checkout.
          git worktree add --detach src "$sha"
      - if: steps.plan.outputs.tag
        uses: ./.github/actions/build-release
        with:
          app: ${{ env.APP }}
          version: ${{ steps.plan.outputs.version }}
          root: src
      - name: Publish
        if: steps.plan.outputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
          TAG: ${{ steps.plan.outputs.tag }}
          SHA: ${{ steps.plan.outputs.sha }}
        run: gh release create "$TAG" --latest dist/* --target "$SHA" --title "$APP $VERSION" --notes-file notes.md
      # Every run, promoted or not, so a run that published but failed after it is finished by the next one (a re-run
      # plans nothing: stable already is that code).
      - name: Sync the stable branch to Latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release view --json tagName --jq .tagName)  # no tag: GitHub's Latest
          git fetch -q origin "refs/tags/$latest:refs/tags/$latest"  # just published: not in this checkout yet
          # --force: normally a fast-forward, but a rollback moves stable back, so `stable` must not get a
          # fast-forward-only rule.
          git push --force origin "$(git rev-parse "$latest^{commit}"):refs/heads/stable"
          # What a board on stable does next: read Latest's version, then fetch that version's image.
          # A failure here means stable boards now fail their daily download: promote a good tag to fix it.
          tools/check_channel.sh "$APP" stable "${latest#"$APP"-v}"
