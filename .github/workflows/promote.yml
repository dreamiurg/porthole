name: Promote

# Moves a Porthole release from beta to stable. Every release starts as a GitHub pre-release
# (beta). Promoting clears the flag and marks it Latest, so releases/latest (what stable boards
# read) points at it, and moves the `stable` branch to its commit.
# Promoting an older tag is how stable rolls back.
# Daily, it also promotes the newest beta by itself once that beta has been the newest for
# SETTLE_HOURS: any newer beta (a fix, say) restarts the wait, so stable gets a beta that went
# untouched for two days.

on:
  schedule:
    - cron: "0 17 * * *"  # 10:00 Pacific in summer (09:00 in winter)
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to promote, e.g. porthole-v0.15.0 (empty: the newest pre-release)"
        required: false
        default: ""

concurrency:
  group: promote
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # tags, to resolve the tag's commit
      - name: Promote
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SETTLE_HOURS: 48
        run: |
          if [ -z "$TAG" ]; then
            newest=$(gh release list --limit 100 --json tagName,isPrerelease,createdAt \
              --jq '[.[] | select(.isPrerelease and (.tagName | test("^porthole-v[0-9]+[.][0-9]+[.][0-9]+$")))]
                    | sort_by(.tagName | ltrimstr("porthole-v") | split(".") | map(tonumber)) | last
                    | "\(.tagName // "") \(.createdAt // "")"')
            TAG=${newest% *}
            if [ "${{ github.event_name }}" = schedule ]; then
              if [ -z "$TAG" ]; then echo "no beta newer than stable"; exit 0; fi
              age=$(( ($(date +%s) - $(date -d "${newest#* }" +%s)) / 3600 ))
              if [ "$age" -lt "$SETTLE_HOURS" ]; then echo "$TAG is ${age}h old, waiting for ${SETTLE_HOURS}h"; exit 0; fi
            fi
          fi
          if ! [[ "$TAG" =~ ^porthole-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::no porthole-vX.Y.Z tag to promote (got '$TAG')"
            exit 1
          fi
          echo "promoting $TAG"
          # Branch first: if the push fails, the release is still a pre-release and nothing changed.
          # --force: normally a fast-forward, but promoting an older tag (a rollback) moves stable back,
          # so `stable` must not get a fast-forward-only rule.
          git push --force origin "$TAG^{commit}:refs/heads/stable"
          gh release edit "$TAG" --prerelease=false --latest
          # What a board on stable does next: read Latest's version, then fetch that version's image.
          # A failure here means stable boards now fail their daily download: promote a good tag to fix it.
          tools/check_channel.sh porthole stable "${TAG#porthole-v}"
