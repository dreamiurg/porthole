name: Promote

# Cuts a stable Porthole release from a beta. Every merge ships a beta patch (0.38.1, 0.38.2, ...;
# see release.yml). Promoting beta 0.38.7 rebuilds its commit as 0.39.0, publishes that as GitHub's
# Latest (what stable boards read: releases/latest), and moves the `stable` branch to it. The
# next beta is 0.39.1. Beta boards stay where they are: 0.39.0 is the code they already run.
#
# Daily, it promotes by itself: the newest beta that is at least MIN_AGE_HOURS old, newer than
# the current stable, and not yanked (yank.yml). So stable trails beta by about three days, and
# a beta found broken in that time never reaches stable.
# By hand: run it with a tag to promote that tag now, or with no tag for the newest beta.
# Promoting an older tag is a rollback: the old code goes out as the next minor, so every stable
# board takes it (boards never install an older version).

on:
  schedule:
    - cron: "0 17 * * *"  # 10:00 Pacific in summer (09:00 in winter)
  workflow_dispatch:
    inputs:
      tag:
        description: "Beta tag to promote, e.g. porthole-v0.38.7 (empty: the newest beta that isn't yanked)"
        required: false
        default: ""

concurrency:
  group: release  # shared with release.yml: both create porthole-v tags
  cancel-in-progress: false

permissions:
  contents: write

env:
  APP: porthole
  MIN_AGE_HOURS: 72

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # tags and history, for the version and the notes
      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          # By hand with no tag: the newest beta now. On schedule: only one old enough.
          MIN_AGE: ${{ github.event_name == 'schedule' && env.MIN_AGE_HOURS || '0' }}
        run: |
          gh release list --limit 200 --json tagName,name,isPrerelease,createdAt \
            | python3 tools/release.py promote --app "$APP" --tag "$TAG" --min-age-hours "$MIN_AGE" > plan.json
          if [ "$(cat plan.json)" = null ]; then
            if [ -n "$TAG" ]; then echo "::error::'$TAG' is not a $APP-vX.Y.Z tag"; exit 1; fi
            echo "nothing to promote: no beta newer than stable that is ${MIN_AGE}h old and not yanked"
            exit 0
          fi
          field() { python3 -c 'import json,sys; print(json.load(open("plan.json"))[sys.argv[1]])' "$1"; }
          field notes > notes.md
          source=$(field source) tag=$(field tag)
          sha=$(git rev-parse "$source^{commit}")  # fails on a tag that does not exist
          printf 'version=%s\ntag=%s\nsha=%s\n' "$(field version)" "$tag" "$sha" >> "$GITHUB_OUTPUT"
          echo "promoting $source ($sha) as $tag"
      # The beta's own commit, beside this checkout: the shared build action and the channel check come from here.
      - if: steps.plan.outputs.tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ steps.plan.outputs.sha }}
          path: src
      - if: steps.plan.outputs.tag
        uses: ./.github/actions/build-release
        with:
          app: ${{ env.APP }}
          version: ${{ steps.plan.outputs.version }}
          root: src
      - name: Publish
        if: steps.plan.outputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
          TAG: ${{ steps.plan.outputs.tag }}
          SHA: ${{ steps.plan.outputs.sha }}
        run: |
          # Already there on a re-run (say the branch push below failed): skip to the branch.
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --latest \
            "$APP-$VERSION-factory.bin" "$APP-$VERSION-web.zip" "$APP-$VERSION-ota.bin" "$APP-version.txt" \
            --target "$SHA" --title "$APP $VERSION" --notes-file notes.md
          # --force: normally a fast-forward, but a rollback moves stable back, so `stable` must not get a
          # fast-forward-only rule.
          git push --force origin "$SHA:refs/heads/stable"
      - name: Stable channel resolves to this release
        # What a board on stable does next: read Latest's version, then fetch that version's image.
        # A failure here means stable boards now fail their daily download: promote a good tag to fix it.
        if: steps.plan.outputs.tag
        run: tools/check_channel.sh "$APP" stable "${{ steps.plan.outputs.version }}"
