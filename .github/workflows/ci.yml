name: CI

# CI is a backstop, not the first line of defense: the pre-commit and pre-push hooks
# run everything here on the author's machine first (see CONTRIBUTING.md). On a PR it
# only builds what the PR touched; a few-second `changes` job decides that, so lint
# (static) and the app suites run in parallel instead of the suites waiting for lint.
# PRs need not be up to date with main to merge, so every push to main runs the full
# suite again: release.yml publishes only after this run passes on that commit.
#
# Caches: a PR can only restore caches saved on main or on its own branch. So PRs only
# restore the PlatformIO cache (1.4 GB; PR-scoped copies were evicting main's from the 10 GB
# quota), and main saves it on a run that missed (a push changing a file the cache key
# depends on, or eviction). Before this, PRs mostly missed and rebuilt everything.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 0"  # weekly full run on main: catches toolchain and runner drift, feeds the badge
  workflow_dispatch:

concurrency:
  # On main, a newer push cancels the older run; its release then ships with the newer commit's. The weekly and manual
  # runs get groups of their own: in the push's group they would cancel a merge's run, and release.yml only releases
  # after a push's run that passed, so that merge's beta would wait, unnoticed, for the next merge.
  group: ${{ github.workflow }}-${{ github.head_ref || format('{0}-{1}', github.ref, github.event_name) }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # PlatformIO keeps downloaded archives in ~/.platformio/.cache; keep them out of the cached dir.
  PLATFORMIO_CACHE_DIR: /tmp/pio-downloads

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      porthole: ${{ steps.changes.outputs.porthole }}
      porthole-firmware: ${{ steps.changes.outputs.porthole-firmware }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2
      - name: Detect what changed
        id: changes
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            files=$(git diff --name-only HEAD^1 HEAD)
          else
            files=ALL
          fi
          code=$(printf '%s\n' "$files" | grep -Ev '\.md$|(^|/)docs/' || true)
          shared='^(ALL$|\.github/|platform/|tools/fail-on-warning\.sh$|Makefile$|\.pre-commit-config\.yaml$|pyproject\.toml$)'
          hit() { printf '%s\n' "$code" | grep -Eq "$shared|$1" && echo true || echo false; }
          {
            echo "porthole=$(hit '^apps/porthole/')"
            echo "porthole-firmware=$(hit '^apps/porthole/(firmware/|os/|shell/|games/|platformio\.ini$|partitions\.csv$|Makefile$)')"
          } | tee -a "$GITHUB_OUTPUT"

  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install pre-commit==4.7.0  # pinned like the tools below: a required check should not change by itself
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-${{ runner.os }}-  # after a hook bump, only the bumped envs rebuild
      # gitleaks scans only staged changes (--staged), so in CI it checks nothing; it runs in the local hook.
      # Same hooks as a local commit and push. App suites run in their own jobs below.
      - run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: no-commit-to-branch,porthole-check,gitleaks
      - run: pre-commit run complexity --all-files --hook-stage pre-push
      - run: pre-commit gc  # drop envs of bumped-away hook revisions before the cache is saved

  porthole:
    name: Porthole
    needs: changes
    if: needs.changes.outputs.porthole == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install --yes zlib1g-dev libsdl2-dev
      - run: pip install pillow==13.0.0 fonttools==4.61.1 gcovr==8.8  # the versions the local hooks install (.pre-commit-config.yaml)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .tool-versions  # the same Node (and bundled zlib) as local hooks via mise
      - run: make -C apps/porthole ci REQUIRE_NODE=1 REQUIRE_SDL=1  # the Biscuit art --check and the windowed sim must run here, not skip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: failure()
        with:
          name: porthole-playtest-report
          path: |
            apps/porthole/build/playtest/
            apps/porthole/build/coverage/playtest/
          retention-days: 7
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        if: env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/porthole/build/coverage/coverage.xml
          flags: porthole

  # Its own job, so the firmware build runs alongside the host suite instead of after it.
  porthole-firmware:
    name: Porthole firmware
    needs: changes
    if: needs.changes.outputs.porthole-firmware == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: pio
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platform/*.ini') }}  # shared by every app: toolchains come from the platform pin
      # The build a release runs, not just the firmware: the factory image, the version baked in and found in the
      # image, the packaging. A break in any of them fails the PR instead of release.yml on main, after the merge.
      # 0.0.0 is never published. The action also drops ~/.platformio's tools/ and dist/ (idf_tools install copies;
      # builds only need packages/), so what main saves below is already pruned.
      - uses: ./.github/actions/build-release
        with:
          app: porthole
          version: 0.0.0
          cache: "false"
      - if: github.event_name != 'pull_request' && steps.pio.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.platformio
          key: ${{ steps.pio.outputs.cache-primary-key }}

  # The only check branch protection requires. Skipped jobs (nothing changed) count as passing.
  required-checks:
    name: Required Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    needs: [changes, static, porthole, porthole-firmware]
    if: always()
    steps:
      - name: Check results
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
