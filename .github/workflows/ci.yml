name: CI

# CI is a backstop, not the first line of defense: the pre-commit and pre-push hooks
# run everything here on the author's machine first (see CONTRIBUTING.md). To keep
# GitHub minutes low it runs once per PR (not again on merge: the ruleset requires
# branches to be up to date, so main gets exactly what the PR tested), runs cheap
# gates before expensive ones, and only builds what the PR touched.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 0"  # weekly full run on main: catches toolchain and runner drift, feeds the badge
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      porthole: ${{ steps.changes.outputs.porthole }}
      porthole-firmware: ${{ steps.changes.outputs.porthole-firmware }}
      biscuit: ${{ steps.changes.outputs.biscuit }}
      biscuit-firmware: ${{ steps.changes.outputs.biscuit-firmware }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2
      - name: Detect what changed
        id: changes
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            files=$(git diff --name-only HEAD^1 HEAD)
          else
            files=ALL
          fi
          code=$(printf '%s\n' "$files" | grep -Ev '\.md$|(^|/)docs/' || true)
          shared='^(ALL$|\.github/|platform/|Makefile$|\.pre-commit-config\.yaml$|pyproject\.toml$|\.node-version$)'
          hit() { printf '%s\n' "$code" | grep -Eq "$shared|$1" && echo true || echo false; }
          {
            echo "porthole=$(hit '^apps/porthole/')"
            echo "porthole-firmware=$(hit '^apps/porthole/(firmware/|os/|games/|platformio\.ini$)')"
            echo "biscuit=$(hit '^apps/biscuit/')"
            echo "biscuit-firmware=$(hit '^apps/biscuit/(firmware/|src/|package(-lock)?\.json$)')"
          } | tee -a "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # Same hooks as a local commit and push. App suites run in their own jobs below.
      - run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: no-commit-to-branch,porthole-check,biscuit-check
      - run: pre-commit run complexity --all-files --hook-stage pre-push

  porthole:
    name: Porthole
    needs: static
    if: needs.static.outputs.porthole == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install pillow gcovr
      - run: make -C apps/porthole ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: failure()
        with:
          name: porthole-playtest-report
          path: apps/porthole/build/playtest/
          retention-days: 7
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        if: env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/porthole/build/coverage/coverage.xml
          flags: porthole
      - if: needs.static.outputs.porthole-firmware == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platform/*', 'apps/porthole/platformio.ini') }}
      - if: needs.static.outputs.porthole-firmware == 'true'
        run: pip install -r platform/requirements.txt && make -C apps/porthole firmware

  biscuit:
    name: Biscuit
    needs: static
    if: needs.static.outputs.biscuit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/biscuit/package-lock.json
      - run: npm ci
        working-directory: apps/biscuit
      - run: make -C apps/biscuit ci
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        if: env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/biscuit/build/coverage/lcov.info
          flags: biscuit
      - if: needs.static.outputs.biscuit-firmware == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - if: needs.static.outputs.biscuit-firmware == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platform/*', 'apps/biscuit/firmware/platformio.ini') }}
      - if: needs.static.outputs.biscuit-firmware == 'true'
        run: pip install -r platform/requirements.txt && make -C apps/biscuit firmware firmware-test

  # The only check branch protection requires. Skipped jobs (nothing changed) count as passing.
  required-checks:
    name: Required Checks
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [static, porthole, biscuit]
    if: always()
    steps:
      - name: Check results
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
