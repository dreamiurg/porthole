name: CI

# CI is a backstop, not the first line of defense: the pre-commit and pre-push hooks
# run everything here on the author's machine first (see CONTRIBUTING.md). To keep
# GitHub minutes low it runs once per PR (not again on merge: the ruleset requires
# branches to be up to date, so main gets exactly what the PR tested), only builds what
# the PR touched. A few-second `changes` job decides that, so lint (static) and the app
# suites run in parallel instead of the suites waiting for lint.
#
# Caches: a PR can only restore caches saved on main or on its own branch. So PRs only
# restore the PlatformIO cache (1.4 GB; PR-scoped copies were evicting main's from the 10 GB
# quota), and main saves it: the weekly run, plus a full run on a push that changes a file
# the cache keys depend on. Before this, PRs mostly missed and rebuilt everything.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: [.pre-commit-config.yaml, "platform/*.ini", .github/workflows/ci.yml]
  schedule:
    - cron: "0 6 * * 0"  # weekly full run on main: catches toolchain and runner drift, feeds the badge
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # PlatformIO keeps downloaded archives in ~/.platformio/.cache; keep them out of the cached dir.
  PLATFORMIO_CACHE_DIR: /tmp/pio-downloads

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      porthole: ${{ steps.changes.outputs.porthole }}
      porthole-firmware: ${{ steps.changes.outputs.porthole-firmware }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2
      - name: Detect what changed
        id: changes
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            files=$(git diff --name-only HEAD^1 HEAD)
          else
            files=ALL
          fi
          code=$(printf '%s\n' "$files" | grep -Ev '\.md$|(^|/)docs/' || true)
          shared='^(ALL$|\.github/|platform/|tools/fail-on-warning\.sh$|Makefile$|\.pre-commit-config\.yaml$|pyproject\.toml$)'
          hit() { printf '%s\n' "$code" | grep -Eq "$shared|$1" && echo true || echo false; }
          {
            echo "porthole=$(hit '^apps/porthole/')"
            echo "porthole-firmware=$(hit '^apps/porthole/(firmware/|os/|shell/|games/|platformio\.ini$|partitions\.csv$|Makefile$)')"
          } | tee -a "$GITHUB_OUTPUT"

  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-${{ runner.os }}-  # after a hook bump, only the bumped envs rebuild
      # gitleaks scans only staged changes (--staged), so in CI it checks nothing; it runs in the local hook.
      # Same hooks as a local commit and push. App suites run in their own jobs below.
      - run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: no-commit-to-branch,porthole-check,gitleaks
      - run: pre-commit run complexity --all-files --hook-stage pre-push
      - run: pre-commit gc  # drop envs of bumped-away hook revisions before the cache is saved

  porthole:
    name: Porthole
    needs: changes
    if: needs.changes.outputs.porthole == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install pillow gcovr
      - run: make -C apps/porthole ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: failure()
        with:
          name: porthole-playtest-report
          path: apps/porthole/build/playtest/
          retention-days: 7
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        if: env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/porthole/build/coverage/coverage.xml
          flags: porthole
      - if: needs.changes.outputs.porthole-firmware == 'true'
        id: pio
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platform/*.ini') }}  # shared by every app: toolchains come from the platform pin
      - if: needs.changes.outputs.porthole-firmware == 'true'
        run: pip install -r platform/requirements.txt && make -C apps/porthole firmware
      - if: needs.changes.outputs.porthole-firmware == 'true' && github.event_name != 'pull_request' && steps.pio.outputs.cache-hit != 'true'
        name: Prune the PlatformIO cache before saving it (main only)
        run: rm -rf ~/.platformio/tools ~/.platformio/dist  # idf_tools install copies; builds only need packages/
      - if: needs.changes.outputs.porthole-firmware == 'true' && github.event_name != 'pull_request' && steps.pio.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.platformio
          key: ${{ steps.pio.outputs.cache-primary-key }}

  # The only check branch protection requires. Skipped jobs (nothing changed) count as passing.
  required-checks:
    name: Required Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    needs: [changes, static, porthole]
    if: always()
    steps:
      - name: Check results
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
