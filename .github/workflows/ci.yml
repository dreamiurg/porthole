name: CI

# CI is a backstop, not the first line of defense: the pre-commit and pre-push hooks
# run everything here on the author's machine first (see CONTRIBUTING.md). On a PR it
# only builds what the PR touched; a few-second `changes` job decides that, so lint
# (static) and the app suites run in parallel instead of the suites waiting for lint.
# PRs need not be up to date with main to merge, so every push to main runs the full
# suite again: release.yml publishes only after this run passes on that commit.
#
# Caches: a PR can only restore caches saved on main or on its own branch. So PRs only
# restore the PlatformIO cache (1.4 GB; PR-scoped copies were evicting main's from the 10 GB
# quota), and main saves it on a run that missed (a push changing a file the cache key
# depends on, or eviction). Before this, PRs mostly missed and rebuilt everything.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 0"  # weekly full run on main: catches toolchain and runner drift, feeds the badge
  workflow_dispatch:

concurrency:
  # On main, a newer push cancels the older run; its release then ships with the newer commit's.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # PlatformIO keeps downloaded archives in ~/.platformio/.cache; keep them out of the cached dir.
  PLATFORMIO_CACHE_DIR: /tmp/pio-downloads

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      porthole: ${{ steps.changes.outputs.porthole }}
      porthole-firmware: ${{ steps.changes.outputs.porthole-firmware }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2
      - name: Detect what changed
        id: changes
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            files=$(git diff --name-only HEAD^1 HEAD)
          else
            files=ALL
          fi
          code=$(printf '%s\n' "$files" | grep -Ev '\.md$|(^|/)docs/' || true)
          shared='^(ALL$|\.github/|platform/|tools/fail-on-warning\.sh$|Makefile$|\.pre-commit-config\.yaml$|pyproject\.toml$)'
          hit() { printf '%s\n' "$code" | grep -Eq "$shared|$1" && echo true || echo false; }
          {
            echo "porthole=$(hit '^apps/porthole/')"
            echo "porthole-firmware=$(hit '^apps/porthole/(firmware/|os/|shell/|games/|platformio\.ini$|partitions\.csv$|Makefile$)')"
          } | tee -a "$GITHUB_OUTPUT"

  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-${{ runner.os }}-  # after a hook bump, only the bumped envs rebuild
      # gitleaks scans only staged changes (--staged), so in CI it checks nothing; it runs in the local hook.
      # Same hooks as a local commit and push. App suites run in their own jobs below.
      - run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: no-commit-to-branch,porthole-check,gitleaks
      - run: pre-commit run complexity --all-files --hook-stage pre-push
      - run: pre-commit gc  # drop envs of bumped-away hook revisions before the cache is saved

  porthole:
    name: Porthole
    needs: changes
    if: needs.changes.outputs.porthole == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install --yes zlib1g-dev
      - run: pip install pillow fonttools==4.61.1 'gcovr>=8.3'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
      - run: make -C apps/porthole ci REQUIRE_NODE=1  # the Biscuit art --check must run here, not skip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: failure()
        with:
          name: porthole-playtest-report
          path: |
            apps/porthole/build/playtest/
            apps/porthole/build/coverage/playtest/
          retention-days: 7
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        if: env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/porthole/build/coverage/coverage.xml
          flags: porthole

  # Its own job, so the firmware build runs alongside the host suite instead of after it.
  porthole-firmware:
    name: Porthole firmware
    needs: changes
    if: needs.changes.outputs.porthole-firmware == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - id: pio
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platform/*.ini') }}  # shared by every app: toolchains come from the platform pin
      - run: pip install -r platform/requirements.txt && make -C apps/porthole firmware
      - if: github.event_name != 'pull_request' && steps.pio.outputs.cache-hit != 'true'
        name: Prune the PlatformIO cache before saving it (main only)
        run: rm -rf ~/.platformio/tools ~/.platformio/dist  # idf_tools install copies; builds only need packages/
      - if: github.event_name != 'pull_request' && steps.pio.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.platformio
          key: ${{ steps.pio.outputs.cache-primary-key }}

  # The only check branch protection requires. Skipped jobs (nothing changed) count as passing.
  required-checks:
    name: Required Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    needs: [changes, static, porthole, porthole-firmware]
    if: always()
    steps:
      - name: Check results
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
