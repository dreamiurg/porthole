<g font-family="sans-serif" fill="#f2f7fc">
<text x="24" y="38" font-size="22" font-weight="bold">One of the three lid fasteners</text>
<text x="24" y="64" font-size="15" fill="#bbccda">Section through the screw axis · example with a Ø6 mm head</text>
</g>
