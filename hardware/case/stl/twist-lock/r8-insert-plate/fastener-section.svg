<text x="381" y="257">P024 lower lid</text>
<text x="381" y="310">M3 × 8 mm countersunk screw</text>
<text x="381" y="334" font-size="14" fill="#bbccda">90° seat · Ø7.0 mm opening</text>
<text x="24" y="367" font-size="14" fill="#bbccda">The insert is installed from the lid side before assembly. Threads omitted for clarity.</text>
