[tool.ruff]
line-length = 175
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["E701", "E702", "E731", "E741"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["/build/", "/\\.pio/", "/node_modules/"]
# Module names come from the path, so every game can have its own tools/check_content.py.
explicit_package_bases = true
