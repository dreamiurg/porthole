; Shared PlatformIO base for the Waveshare ESP32-S3-Touch-LCD-2.1
; (ESP32-S3R8, 16 MB flash, 8 MB octal PSRAM, round 480x480 ST7701 + CST820 touch).
;
; Every app pulls this in from its own platformio.ini:
;
;   [platformio]
;   extra_configs = ../../platform/waveshare-round.ini
;
;   [env:firmware]
;   extends = waveshare_round
;   build_flags = ${waveshare_round.build_flags} -DMY_APP_FLAG
;
; The platform is pinned: pioarduino 54.03.21 = Arduino-ESP32 3.x on ESP-IDF 5.4.
; Newer pioarduino "stable" releases need PlatformIO Core >= 6.2.

[waveshare_round]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
; The USB-C port is a CH343 USB-UART bridge, so Serial is UART0, not USB CDC.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
monitor_speed = 115200
