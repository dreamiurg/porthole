# Install once per clone:  make hooks   (= pre-commit install --hook-type pre-commit --hook-type pre-push)
# Run by hand:             pre-commit run --all-files
#                          pre-commit run --all-files --hook-stage pre-push
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
exclude: |
  (?x)^(
    apps/porthole/games/pets-club/sprites\.h|
    apps/porthole/games/biscuit/generated/.*|
    apps/porthole/os/font8x8_basic\.h|
    .*\.(ttf|png|bmp)
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/semgrep/pre-commit
    rev: v1.178.0
    hooks:
      - id: semgrep
        name: semgrep SAST
        args: [--config, auto, --error, --quiet, --disable-version-check, --skip-unknown-extensions]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        name: mypy (python tools)
        # The whole tree, not just the changed files: module-name clashes across apps (two tools/device.py)
        # only show up when mypy sees both, which is what CI's --all-files run does.
        args: [--config-file=pyproject.toml, .]
        pass_filenames: false

  - repo: local
    hooks:
      - id: release-tool
        name: release planner self-test
        entry: "tools/fail-on-warning.sh '[A-Za-z]+Warning: ' python3 -W error tools/test_release.py"
        language: system
        pass_filenames: false
        files: ^tools/((release|test_release)\.py|fail-on-warning\.sh)$

      # Per-app gates: each runs only when that app's files change.
      - id: porthole-check
        name: porthole make check
        entry: make -C apps/porthole check
        language: system
        pass_filenames: false
        files: ^apps/porthole/

      # Pre-push: everything CI would run for what you changed, so CI rarely finds anything new.
      - id: complexity
        name: lizard complexity gate
        entry: make complexity
        language: python
        additional_dependencies: [lizard==1.21.0]
        pass_filenames: false
        files: \.(cpp|h|c|js|mjs|py)$
        stages: [pre-push]
      - id: porthole-ci
        name: porthole make ci (playtests, coverage)
        entry: make -C apps/porthole ci
        language: system
        pass_filenames: false
        files: ^apps/porthole/|^tools/fail-on-warning\.sh$
        stages: [pre-push]
      # Firmware builds are incremental locally (seconds) and skipped without PlatformIO.
      - id: porthole-firmware
        name: porthole firmware build
        entry: bash -c 'command -v pio >/dev/null || { echo "PlatformIO not installed, skipping (CI builds it)"; exit 0; }; make -C apps/porthole firmware'
        language: system
        pass_filenames: false
        files: ^apps/porthole/(firmware/|os/|shell/|games/|platformio\.ini$|partitions\.csv$|Makefile$)|^platform/|^tools/fail-on-warning\.sh$
        stages: [pre-push]
