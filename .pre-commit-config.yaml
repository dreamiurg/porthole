# Install once per clone:  make hooks   (= pre-commit install --hook-type pre-commit --hook-type pre-push)
# Run by hand:             pre-commit run --all-files
#                          pre-commit run --all-files --hook-stage pre-push
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
exclude: |
  (?x)^(
    apps/porthole/games/pets-club/sprites\.h|
    apps/porthole/games/biscuit/generated/.*|
    apps/porthole/games/tilt-fc/generated/.*|
    apps/porthole/games/tilt-fc/fonts/OFL\.txt|
    apps/porthole/os/font8x8_basic\.h
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: \.(ttf|png|bmp)$  # art sources and fonts are big by nature; text hooks skip binaries on their own
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/semgrep/pre-commit
    rev: v1.178.0
    hooks:
      - id: semgrep
        name: semgrep SAST
        args: [--config, auto, --error, --quiet, --disable-version-check, --skip-unknown-extensions]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        name: mypy (python tools)
        # The whole tree, not just the changed files: module-name clashes across apps (two tools/device.py)
        # only show up when mypy sees both, which is what CI's --all-files run does.
        args: [--config-file=pyproject.toml, .]
        pass_filenames: false

  - repo: local
    hooks:
      - id: release-tool
        name: release planner self-test
        entry: "tools/fail-on-warning.sh '[A-Za-z]+Warning: ' python3 -W error tools/test_release.py"
        language: system
        pass_filenames: false
        files: ^tools/((release|test_release)\.py|fail-on-warning\.sh)$

      # Per-app gates: each runs only when that app's files change. language: python gives them the same
      # Python packages CI installs (Pillow for the golden screenshots and art checks, gcovr for coverage),
      # so they never depend on whatever the system python3 happens to have.
      - id: porthole-check
        name: porthole make check
        entry: make -C apps/porthole check
        language: python
        additional_dependencies: [pillow, fonttools==4.61.1, gcovr>=8.3]
        pass_filenames: false
        files: ^apps/porthole/

      # Pre-push: everything CI runs (.github/workflows/ci.yml), so CI never finds anything new.
      # CI's static job: every pre-commit hook on every file, not just the files you changed. A file that
      # arrived from another branch is part of the PR too.
      - id: static-all-files
        name: static checks on every file (CI's static job)
        # It checks the working tree, so it refuses to run on uncommitted changes: what it checks is what you push.
        # Your own SKIP still applies on top of the hooks CI skips.
        entry: >-
          bash -c 'git diff --quiet && git diff --cached --quiet
          || { echo "Uncommitted changes: commit or stash them first, so this checks what you push."; exit 1; };
          SKIP="no-commit-to-branch,porthole-check,gitleaks${SKIP:+,$SKIP}"
          pre-commit run --all-files --show-diff-on-failure'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: complexity
        name: lizard complexity gate
        entry: make complexity
        language: python
        additional_dependencies: [lizard==1.21.0]
        pass_filenames: false
        always_run: true  # CI runs it on every PR, and it scans the whole tree anyway
        stages: [pre-push]
      # The app suites run when CI's `changes` job would run them: the app's files, or anything shared
      # (.github/, platform/, the root Makefile, this file, pyproject.toml), docs and Markdown excluded.
      - id: porthole-ci
        name: porthole make ci (playtests, coverage)
        entry: make -C apps/porthole ci REQUIRE_NODE=1
        language: python
        additional_dependencies: [pillow, fonttools==4.61.1, gcovr>=8.3]
        pass_filenames: false
        files: ^(apps/porthole/|\.github/|platform/|tools/fail-on-warning\.sh$|Makefile$|\.pre-commit-config\.yaml$|pyproject\.toml$)
        exclude: \.md$|(^|/)docs/
        stages: [pre-push]
      # Firmware builds are incremental locally (seconds). CI builds them, so a missing PlatformIO fails the push.
      - id: porthole-firmware
        name: porthole firmware build
        entry: bash -c 'command -v pio >/dev/null || { echo "PlatformIO is missing, install it with pip install -r platform/requirements.txt (CI builds the firmware)"; exit 1; }; make -C apps/porthole firmware'
        language: system
        pass_filenames: false
        files: ^(apps/porthole/(firmware/|os/|shell/|games/|platformio\.ini$|partitions\.csv$|Makefile$)|\.github/|platform/|tools/fail-on-warning\.sh$|Makefile$|\.pre-commit-config\.yaml$|pyproject\.toml$)
        exclude: \.md$|(^|/)docs/
        stages: [pre-push]
