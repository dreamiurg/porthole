# Install once per clone:  make hooks   (= pre-commit install --hook-type pre-commit --hook-type pre-push)
# Run by hand:             pre-commit run --all-files
#                          pre-commit run --all-files --hook-stage pre-push
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
exclude: |
  (?x)^(
    apps/biscuit/firmware/generated/.*|
    apps/pets-club/src/game/sprites\.h|
    apps/pets-club/src/game/font8x8_basic\.h|
    .*\.(ttf|png|bmp)
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/semgrep/pre-commit
    rev: v1.178.0
    hooks:
      - id: semgrep
        name: semgrep SAST
        args: [--config, auto, --error, --quiet, --disable-version-check, --skip-unknown-extensions]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        name: mypy (python tools)
        args: [--config-file=pyproject.toml]

  - repo: local
    hooks:
      - id: release-tool
        name: release planner self-test
        entry: python3 tools/test_release.py
        language: system
        pass_filenames: false
        files: ^tools/(release|test_release)\.py$

      # Per-app gates: each runs only when that app's files change.
      - id: pets-club-check
        name: pets-club make check
        entry: make -C apps/pets-club check
        language: system
        pass_filenames: false
        files: ^apps/pets-club/
      - id: biscuit-check
        name: biscuit make check
        entry: make -C apps/biscuit check
        language: system
        pass_filenames: false
        files: ^apps/biscuit/

      # Pre-push: everything CI would run for what you changed, so CI rarely finds anything new.
      - id: complexity
        name: lizard complexity gate
        entry: make complexity
        language: python
        additional_dependencies: [lizard==1.21.0]
        pass_filenames: false
        files: \.(cpp|h|c|js|mjs|py)$
        stages: [pre-push]
      - id: pets-club-ci
        name: pets-club make ci (playtests, coverage)
        entry: make -C apps/pets-club ci
        language: system
        pass_filenames: false
        files: ^apps/pets-club/
        stages: [pre-push]
      - id: biscuit-ci
        name: biscuit make ci (coverage)
        entry: make -C apps/biscuit ci
        language: system
        pass_filenames: false
        files: ^apps/biscuit/
        stages: [pre-push]
      # Firmware builds are incremental locally (seconds) and skipped without PlatformIO.
      - id: pets-club-firmware
        name: pets-club firmware build
        entry: bash -c 'command -v pio >/dev/null || { echo "PlatformIO not installed, skipping (CI builds it)"; exit 0; }; make -C apps/pets-club firmware'
        language: system
        pass_filenames: false
        files: ^apps/pets-club/(src/|platformio\.ini$)|^platform/
        stages: [pre-push]
      # The browser build ships with each release; catch a broken one before merge. Skipped without Emscripten.
      - id: pets-club-play
        name: pets-club browser build
        entry: bash -c 'command -v em++ >/dev/null || { echo "Emscripten not installed, skipping (the release builds it)"; exit 0; }; make -C apps/pets-club play'
        language: system
        pass_filenames: false
        files: ^apps/pets-club/(src/game/|host/web\.cpp$|web/)
        stages: [pre-push]
      - id: biscuit-firmware
        name: biscuit firmware build + layout test
        entry: bash -c 'command -v pio >/dev/null || { echo "PlatformIO not installed, skipping (CI builds it)"; exit 0; }; make -C apps/biscuit firmware firmware-test'
        language: system
        pass_filenames: false
        files: ^apps/biscuit/(firmware/|src/|package(-lock)?\.json$)|^platform/
        stages: [pre-push]
