# Install once per clone:  make hooks   (= pre-commit install --hook-type pre-commit --hook-type pre-push)
# Run by hand:             pre-commit run --all-files
#                          pre-commit run --all-files --hook-stage pre-push
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
exclude: |
  (?x)^(
    apps/biscuit/firmware/generated/.*|
    apps/pets-club/src/game/sprites\.h|
    apps/pets-club/src/game/font8x8_basic\.h|
    .*\.(ttf|png|bmp)
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: semgrep
        name: semgrep SAST
        entry: semgrep scan --config auto --error --quiet
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: mypy
        name: mypy (python tools)
        entry: mypy
        language: system
        types: [python]
        require_serial: true

      # Per-app gates: each runs only when that app's files change.
      - id: pets-club-check
        name: pets-club make check
        entry: make -C apps/pets-club check
        language: system
        pass_filenames: false
        files: ^apps/pets-club/
      - id: biscuit-check
        name: biscuit make check
        entry: make -C apps/biscuit check
        language: system
        pass_filenames: false
        files: ^apps/biscuit/

      - id: complexity
        name: lizard complexity gate
        entry: make complexity
        language: system
        pass_filenames: false
        files: \.(cpp|h|c|js|mjs|py)$
        stages: [pre-push]
      - id: pets-club-ci
        name: pets-club make ci (playtests, coverage)
        entry: make -C apps/pets-club ci
        language: system
        pass_filenames: false
        files: ^apps/pets-club/
        stages: [pre-push]
      - id: biscuit-ci
        name: biscuit make ci (coverage)
        entry: make -C apps/biscuit ci
        language: system
        pass_filenames: false
        files: ^apps/biscuit/
        stages: [pre-push]
