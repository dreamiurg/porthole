; Porthole: device firmware for the Waveshare ESP32-S3-Touch-LCD-2.1 (round 480x480), Pets Club inside.
; Board, platform pin and PSRAM flags come from the shared base; only app specifics live here.
; Sources: firmware/ (Arduino entry + board layer), os/ (shared runtime), games/ (each game).
[platformio]
extra_configs = ../../platform/waveshare-round.ini
src_dir = .

[env:firmware]
extends = waveshare_round
board_build.partitions = default_16MB.csv
upload_speed = 921600
extra_scripts = post:../../platform/factory_image.py
build_src_filter = +<firmware/> +<os/> +<games/>
build_flags =
    ${waveshare_round.build_flags}
    -Wall -Wextra -Wno-unused-parameter
    -Ios -Igames/pets-club
