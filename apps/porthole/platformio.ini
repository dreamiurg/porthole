; Porthole: device firmware for the Waveshare ESP32-S3-Touch-LCD-2.1 (round 480x480): profiles, a launcher, Pets Club.
; Board, platform pin and PSRAM flags come from the shared base; only app specifics live here.
; Sources: firmware/ (Arduino entry + board layer), os/ (shared runtime), shell/ (profiles, launcher), games/ (each game).
[platformio]
extra_configs = ../../platform/waveshare-round.ini
src_dir = .

[env:firmware]
extends = waveshare_round
board_build.partitions = default_16MB.csv
upload_speed = 921600
extra_scripts = post:../../platform/factory_image.py
build_src_filter = +<firmware/> +<os/> +<shell/> +<games/>
build_flags =
    ${waveshare_round.build_flags}
    -Ios -Ishell -Igames/pets-club
build_src_flags = ${waveshare_round.src_warnings} -Wno-unused-parameter
