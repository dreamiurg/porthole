; Porthole: device firmware for the Waveshare ESP32-S3-Touch-LCD-2.1 (round 480x480): profiles, a launcher, Pets Club.
; Board, platform pin and PSRAM flags come from the shared base; only app specifics live here.
; Sources: firmware/ (Arduino entry + board layer), os/ (shared runtime), shell/ (profiles, launcher), games/ (each game).
[platformio]
extra_configs = ../../platform/waveshare-round.ini
src_dir = .

[env:firmware]
extends = waveshare_round
; Two 7.9 MB OTA app slots (wireless updates, firmware/net.cpp); nvs stays at 0x9000 so saves survive a reflash.
; maximum_size is one slot, so the build fails once the firmware outgrows it. PORTHOLE_VERSION defaults to "dev"
; (main.cpp); release CI sets it through PLATFORMIO_BUILD_FLAGS.
board_build.partitions = partitions.csv
board_upload.maximum_size = 8323072
upload_speed = 921600
extra_scripts = post:../../platform/factory_image.py
build_src_filter = +<firmware/> +<os/> +<shell/> +<games/>
build_flags =
    ${waveshare_round.build_flags}
    -Ios -Ishell -I.
; ArduinoJson: Radar's feed and the Home lookup parse adsb.fi, adsbdb and Nominatim answers (firmware/net.cpp).
lib_deps = bblanchon/ArduinoJson@7.4.2
build_src_flags = ${waveshare_round.src_warnings} -Wno-unused-parameter
