[platformio]
src_dir = .
extra_configs = ../../../platform/waveshare-round.ini

[env:firmware]
extends = waveshare_round
board_upload.maximum_size = 12582912
board_build.partitions = partitions.csv
extra_scripts =
  pre:tools/gen_assets.py
  post:../../../platform/factory_image.py
build_src_filter = +<src/> +<generated/assets.cpp> +<generated/font*.c>
; Arduino-ESP32 3.x adds -std=gnu++2b and -std=gnu++2a after our flags; drop them so gnu++17 actually applies
; (under C++20, LVGL 8's own headers trip -Wdeprecated-enum-enum-conversion in every file that includes them).
build_unflags = -std=gnu++2a -std=gnu++2b
build_flags =
  ${waveshare_round.build_flags}
  -std=gnu++17
  -DLV_CONF_INCLUDE_SIMPLE
  -Iinclude
  -Igenerated
build_src_flags = ${waveshare_round.src_warnings}
lib_deps = lvgl/lvgl@8.3.10
upload_speed = 115200
